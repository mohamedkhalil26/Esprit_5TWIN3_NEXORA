apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: app-storage
spec:
  accessModes: [ReadWriteMany]
  resources:
    requests: { storage: 2Gi }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: app-uploads
spec:
  accessModes: [ReadWriteMany]
  resources:
    requests: { storage: 5Gi }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
spec:
  replicas: 2
  selector:
    matchLabels: { app: nexora-app }
  template:
    metadata:
      labels: { app: nexora-app }
    spec:
      containers:
        - name: php-fpm
          image: nexora-app:local
          imagePullPolicy: IfNotPresent
          ports:
            - { name: fpm, containerPort: 9000 }
          envFrom:
            - configMapRef: { name: nexora-config }
          env:
            - { name: APP_KEY, valueFrom: { secretKeyRef: { name: nexora-secrets, key: APP_KEY } } }
            - { name: DB_PASSWORD, valueFrom: { secretKeyRef: { name: nexora-secrets, key: DB_PASSWORD } } }
            - { name: MAIL_USERNAME, valueFrom: { secretKeyRef: { name: nexora-secrets, key: MAIL_USERNAME } } }
            - { name: MAIL_PASSWORD, valueFrom: { secretKeyRef: { name: nexora-secrets, key: MAIL_PASSWORD } } }
            - { name: MAIL_FROM_ADDRESS, valueFrom: { secretKeyRef: { name: nexora-secrets, key: MAIL_FROM_ADDRESS } } }
            - { name: OPENROUTER_API_KEY, valueFrom: { secretKeyRef: { name: nexora-secrets, key: OPENROUTER_API_KEY } } }
          volumeMounts:
            - { name: app-storage, mountPath: /var/www/html/storage }
            - { name: app-uploads, mountPath: /var/www/html/public/uploads }
          readinessProbe:
            tcpSocket: { port: fpm }
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket: { port: fpm }
            initialDelaySeconds: 25
            periodSeconds: 20
      volumes:
        - { name: app-storage, persistentVolumeClaim: { claimName: app-storage } }
        - { name: app-uploads, persistentVolumeClaim: { claimName: app-uploads } }
---
apiVersion: v1
kind: Service
metadata:
  name: app
spec:
  selector: { app: nexora-app }
  ports:
    - { name: fpm, port: 9000, targetPort: fpm }
