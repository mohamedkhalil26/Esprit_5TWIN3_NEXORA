apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
data:
  prometheus.yml: |
    global:
      scrape_interval: 30s
    scrape_configs:
      - job_name: prometheus
        static_configs: [{ targets: ['localhost:9090'] }]
      - job_name: node-exporter
        static_configs: [{ targets: ['node-exporter.nexora-monitoring.svc.cluster.local:9100'] }]
      - job_name: blackbox-exporter
        static_configs: [{ targets: ['blackbox-exporter.nexora-monitoring.svc.cluster.local:9115'] }]
      - job_name: kube-state-metrics
        static_configs: [{ targets: ['kube-state-metrics.nexora-monitoring.svc.cluster.local:8080'] }]
      - job_name: nexora-http
        metrics_path: /probe
        params: { module: [http_2xx] }
        static_configs: [{ targets: ['http://nginx.nexora.svc.cluster.local/up'] }]
        relabel_configs:
          - { source_labels: [__address__], target_label: __param_target }
          - { source_labels: [__param_target], target_label: instance }
          - { target_label: __address__, replacement: blackbox-exporter.nexora-monitoring.svc.cluster.local:9115 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
spec:
  replicas: 1
  selector:
    matchLabels: { app: prometheus }
  template:
    metadata:
      labels: { app: prometheus }
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:v2.54.1
          args: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus", "--web.enable-lifecycle"]
          ports: [{ name: web, containerPort: 9090 }]
          volumeMounts:
            - { name: config, mountPath: /etc/prometheus, readOnly: true }
            - { name: data, mountPath: /prometheus }
          readinessProbe: { httpGet: { path: /-/ready, port: web }, initialDelaySeconds: 10 }
          livenessProbe: { httpGet: { path: /-/healthy, port: web }, initialDelaySeconds: 20 }
      volumes:
        - { name: config, configMap: { name: prometheus-config } }
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
spec:
  selector: { app: prometheus }
  ports: [{ name: web, port: 9090, targetPort: web }]
